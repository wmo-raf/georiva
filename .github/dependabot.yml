# One grouped PR per ecosystem per week, instead of one PR per package per
# advisory. Ungrouped, every uv bump rewrites georiva/uv.lock and each merge
# conflicts the rest of the queue.
#
# Version updates are capped at patch/minor: a major bump is a decision, not a
# chore. Security updates are grouped too but uncapped — a fix that only
# exists in a new major still gets proposed.
#
# titiler-app is its own uv project (own pyproject.toml + uv.lock, #621), so it
# rides in the uv entry's `directories` and shares its groups and caps.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /georiva
      - /titiler-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held (core only — titiler-app doesn't depend on them): eckitlib 2.5
      # bundles a second libproj that breaks pyproj (#625).
      # Also capped in georiva/pyproject.toml; lift both together.
      - dependency-name: eccodeslib
      - dependency-name: eckitlib

  - package-ecosystem: npm
    directories:
      - /georiva/src/georiva/ingestion/ingestion-dashboard
      - /georiva/src/georiva/config/datetime-selector
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
