worker_processes auto;
error_log /var/log/nginx/error.log;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    ### uncomment for ssl

    #server {
    #    listen 80;
    #    server_name domain.tld www.domain.tld;
    #    return 301 https://www.domain.tld$request_uri;
    #}

    #server {
    #    listen 443 ssl;
    #    server_name domain.tld;
    #   include /etc/nginx/ssl/ssl.conf;
    #   return 301 https://www.domain.tld$request_uri;
    #}

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ---------------------------------------------------------------------
    # The tile gateway (#274)
    #
    # Titiler and Martin resolve no tenant and hold no tenancy logic — that is
    # the property ADR 0013 protects, so the gate cannot live in either. It
    # lives here instead: before proxying a tile, nginx subrequests Django,
    # which reads the original request line and answers 204 or 403.
    # ---------------------------------------------------------------------

    # Everything below reads $request_uri and never $arg_*, and that is not a
    # style choice. An auth_request subrequest inherits the original
    # $request_uri but *not* its arguments, so inside the gate every $arg_* is
    # empty — which would silently collapse every tile of every collection onto
    # one cache key and serve the first caller's answer to all of them. Reading
    # the URI keeps these correct in both contexts.

    # The credential a client can only send in a URL (ADR 0014), lifted out for
    # the subrequest to forward.
    map $request_uri $tile_auth_api_key {
        ~[?&]api_key=(?<presented_key>[^&]*)  $presented_key;
        default "";
    }

    # The decision is per collection, but a tile URL is per tile. Keying the
    # cache on the whole URI would therefore never hit — every z/x/y is a fresh
    # question — so the key is narrowed to the part that actually decides: the
    # org/catalog/collection triple, in whichever plane's grammar carries it.
    # Anything unrecognised falls back to the full URI, so an address this map
    # does not understand gets its own entry rather than sharing somebody
    # else's. Django is still what parses for the decision; this only decides
    # which two requests may share an answer.
    map $request_uri $tile_auth_scope {
        # Titiler carries the triple in the path, ahead of the varying route.
        ~^/titiler/(?<ttl_org>[^/?]+)/(?<ttl_cat>[^/?]+)/(?<ttl_coll>[^/?]+)/[^/?]+/
            "titiler:$ttl_org:$ttl_cat:$ttl_coll";
        # Martin carries it in the query, so the query is kept whole and only
        # the tile coordinates are dropped. Narrowing this to the three
        # parameters that decide would cache better and is deliberately not
        # done: a regex picking `org=` out of a query would take the first of a
        # repeated parameter, while `scope_of` refuses repeats outright, so a
        # crafted `?org=a&org=b` would file its denial under the same key the
        # honest URL uses and 404 that collection for everyone sharing the
        # credential until the entry expired. Keeping the query whole keeps the
        # two addresses distinct, which is worth more than the hit rate.
        ~^/martin/boundary_stats/[0-9]+/[0-9]+/[0-9]+(?<mrt_query>[?].*)?$
            "martin:$mrt_query";
        default $request_uri;
    }

    # The one address behind this proxy whose clients can parse nothing but OGC
    # XML (#372). Everything else here is reached by a browser or a scripting
    # client that copes with an HTML error page; the WMTS KVP endpoint is
    # reached by desktop GIS from the 2010s, and an unparseable body there reads
    # as a broken layer rather than as the expired key it is. Story 18 of #354
    # promises those clients an ExceptionReport for *every* refusal on the
    # endpoint, and the two below are the ones the gate answers before Titiler's
    # own shim — which already keeps that promise for its own — is ever reached.
    #
    # Keyed on the path and never on `REQUEST=`, because the promise is per
    # endpoint and not per operation: GetTile, GetCapabilities and
    # GetFeatureInfo all carry their operation in the query and all fail the
    # same way here. Anchored so it names that endpoint and nothing near it —
    # a tile route under the same org, or a `…/wmts/anything` that is not this
    # endpoint at all, keeps nginx's own error page.
    #
    # A third copy of Django's URL grammar, and the only kind this file can
    # hold: the same three-segment shape `scope_of` recognises, spelt from
    # `TITILER_PREFIX` and `WMTS_KVP_SEGMENT` in
    # `core/machine_plane/addresses.py` (ADR 0013 wants one author for these,
    # and nginx cannot import one). Change it with them — the cost of drift is
    # only ever a legacy client getting an HTML error page it cannot read,
    # never a wrong tenancy answer, because the gate below does its own
    # recognising and this map has no say in it.
    #
    # The trailing slash is optional because `scope_of` drops empty segments,
    # so `…/wmts/` is the endpoint on the side that judges the request — and a
    # client that appends one would otherwise be denied correctly and told so
    # in a language it cannot read.
    map $request_uri $wmts_kvp_endpoint {
        ~^/titiler/[^/?]+/wmts/?(\?|$)  1;
        default                          "";
    }

    # ~60s of memory for a decision that is one indexed query to make. The
    # trade is stated rather than hidden: revoking a key or a membership can
    # take up to a minute to bite on tiles already being drawn, while it is
    # immediate on every Django plane. Sized small — this caches a status code,
    # not a body.
    proxy_cache_path /var/cache/nginx/tile_auth levels=1:2 keys_zone=tile_auth:4m
                     max_size=32m inactive=5m use_temp_path=off;

    # Bodies for the machine plane's immutable textures. No proxy_cache_valid
    # is set anywhere this zone is used, so only a response that declares its
    # own cacheability is stored — and the one Titiler route that does is
    # encoded-preview.png, whose URL carries the render-config hash that makes
    # `immutable` honest (ADR 0021). Tiles and colorized previews send no
    # cache headers today; since ADR 0023, Django-built colorized preview
    # URLs *do* carry what would make caching honest — the per-style version
    # token (`v=`) and, for a pinned style, `style=<slug>`. Tile URLs are
    # assembled by clients from the tile-config payload and do not carry the
    # token yet. Either way the zone's key already tells styled URLs apart:
    # `proxy_cache_key "$request_uri"` below keys on the full original
    # request line *including the query string* (nginx defines $request_uri
    # as the complete original URI with arguments — verified against the
    # nginx docs for #322), so `?style=analyst&v=aaaa` and
    # `?style=official&v=bbbb` are distinct entries, never one overwriting
    # the other. Enabling body caching for a colorized route is therefore a
    # matter of its URLs carrying the token and Titiler declaring
    # cacheability on it; nothing here needs to change. Sized for textures,
    # not tiles — a mid-size grid is ~0.5 MB, so 2g holds thousands of
    # timesteps.
    proxy_cache_path /var/cache/nginx/tile_content levels=1:2 keys_zone=tile_content:10m
                     max_size=2g inactive=30d use_temp_path=off;


    server {
        listen 80;
        server_name _;

        # include /etc/nginx/ssl/ssl.conf;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location /admin/api/ingestion/events/ {
            set $upstream georiva:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            set $upstream georiva:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /stac-browser/ {
            set $upstream georiva-stac-browser:8080;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }


        # The subrequest itself. `internal` means nginx will only reach it from
        # `auth_request` — a client asking directly gets 404 — so the header it
        # trusts below can only have been set here.
        location = /internal/tile-auth/ {
            internal;
            # Deliberately not `$upstream`, the name every other location here
            # uses. A subrequest shares its parent's variable storage, so
            # setting `$upstream` in here would rewrite it *in the location that
            # called us* — and the tile would then be proxied to Django, after
            # this gate had cheerfully approved it.
            set $tile_auth_upstream georiva:8000;

            # The `?api_key=` transport (ADR 0014) is how QGIS and every web map
            # library carry a credential, and a subrequest has no query string
            # of its own, so it is forwarded explicitly — from the URI map
            # above, because `$arg_api_key` is empty in here. The session cookie
            # and `Authorization` header need no help: a subrequest inherits
            # the request headers.
            proxy_pass http://$tile_auth_upstream/internal/tile-auth/?api_key=$tile_auth_api_key;

            # The address being judged. The subrequest's own URI is this
            # endpoint's, so the original request line has to travel separately.
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;

            proxy_cache tile_auth;
            # The Host is part of the key because it is part of the decision:
            # the gate denies an org segment that disagrees with it, and a key
            # without it would let a 204 cached on one organisation's host be
            # replayed on another's for the length of the TTL. The session
            # cookie is shared across the subdomains (SESSION_COOKIE_DOMAIN), so
            # it does not tell the two hosts apart on its own.
            proxy_cache_key "$http_host|$tile_auth_scope|$http_authorization|$cookie_sessionid|$tile_auth_api_key";
            proxy_cache_valid 204 401 403 60s;
            # The key above already carries the credential, so Django's own
            # cache headers would only ever narrow what is already correct —
            # and `Vary: Cookie` from SessionMiddleware would otherwise stop
            # this caching at all.
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        }

        # 403 is the only denial the gate issues, and it becomes the 404 every
        # other plane answers: a private tile you may not see does not exist
        # (ADR 0014). 401 keeps its own status — it says a presented key is
        # broken, which is true whether the collection exists or not, and is
        # what tells a scripting client to go and look at its credential.
        #
        # Both catch the gate's answer and not a tile server's own:
        # `proxy_intercept_errors` is off by default, so an upstream status is
        # passed to the client untouched. Turning it on in either location below
        # would start disguising Titiler's and Martin's errors as tenancy
        # denials — and on the WMTS endpoint it would overwrite the shim's own
        # ExceptionReport, which says far more than the generic one here can.
        #
        # What the two arms add is a *body* for the one endpoint that needs a
        # parseable one (#372). The report is rendered here rather than fetched
        # from Django because it is a constant: the gate's refusal carries
        # nothing per-request to say beyond which of the two it was, and an
        # upstream hop would put a request on Django for every tile of a QGIS
        # canvas whose key has just expired — the one moment the instance is
        # already answering nothing useful. Django is still what *decides*; this
        # only spells the decision in a dialect the caller can read.
        location @tile_denied {
            # Where `return`'s body takes its media type from. Stated even
            # though only the WMTS arm sends one: a bare `return 404` renders
            # nginx's own HTML error page and never consults this.
            default_type application/xml;
            # `if` with nothing but a `return` in it — the one shape the nginx
            # authors document as safe inside a location.
            if ($wmts_kvp_endpoint) {
                # Deliberately says neither which of the two it was nor whether
                # anything is there at all: the gate denies an unknown
                # organisation, an org segment disagreeing with the dialled
                # host, and a collection this caller may not see with the one
                # answer, and distinguishing them in the text would answer
                # precisely the question the `private` tier exists to keep quiet
                # (ADR 0014).
                return 404 '<?xml version="1.0" encoding="UTF-8"?>
<ExceptionReport xmlns="http://www.opengis.net/ows/1.1" version="1.1.0"><Exception exceptionCode="InvalidParameterValue"><ExceptionText>No WMTS service or layer at this address</ExceptionText></Exception></ExceptionReport>';
            }
            return 404;
        }

        # The other half of the same fix: a key Django refused. Worth a locator,
        # because unlike the denial above it names the one thing the caller can
        # actually go and fix — the same reading, and the same wording, the
        # shim's own `_translate_capabilities_error` gives a direct caller.
        location @tile_unauthorized {
            default_type application/xml;
            if ($wmts_kvp_endpoint) {
                return 401 '<?xml version="1.0" encoding="UTF-8"?>
<ExceptionReport xmlns="http://www.opengis.net/ows/1.1" version="1.1.0"><Exception exceptionCode="InvalidParameterValue" locator="API_KEY"><ExceptionText>The presented credential was refused</ExceptionText></Exception></ExceptionReport>';
            }
            return 401;
        }

        location /titiler/ {
            set $upstream georiva-titiler-app:8000;

            auth_request /internal/tile-auth/;
            error_page 403 = @tile_denied;
            # Not on `/martin/` below, which serves no OGC endpoint and so has
            # no client that would be helped by an XML body. `=` with no status
            # after it keeps whatever the named location returns, which is the
            # 401 the gate issued.
            error_page 401 = @tile_unauthorized;

            # The full request line is the key: org/catalog/collection/variable
            # travel in the path; time/reftime, the style selector and the
            # version token (`style=`/`v=`, ADR 0023) in the query — all part
            # of $request_uri, so each style of each timestep is its own
            # entry. The Host and credential are deliberately NOT in the
            # key — the body is derived from the COG alone and identical for
            # every viewer allowed to see it, and allowing is the
            # auth_request's job, which runs on every request, hit or miss.
            proxy_cache tile_content;
            proxy_cache_key "$request_uri";
            # One generation per texture under fan-out: concurrent misses on
            # the same URL wait for a single upstream render instead of
            # stampeding Titiler.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            add_header X-Cache-Status $upstream_cache_status;

            rewrite ^/titiler/(.*) /$1 break;
            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Gated on the collection its statistics were computed from, not on
        # anything of its own: `georiva_boundary_stats` joins back to the
        # collection and filters on nothing about its visibility, so an ungated
        # Martin would be a second, coarser reading of the same private data.
        location /martin/ {
            set $upstream georiva-martin:3000;

            auth_request /internal/tile-auth/;
            error_page 403 = @tile_denied;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Public, unsigned assets from the georiva-assets MinIO bucket.
        # Path-style addressing means the bucket name is already the first
        # path segment, so no rewrite is needed. The bucket's anonymous
        # read policy (s3:GetObject only) is applied by `setup_minio`.
        location /georiva-assets/ {
            set $upstream georiva-minio:9000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }

    }
}