# The tile server's dependencies, locked in uv.lock (#621). A standalone uv
# project like core (georiva/pyproject.toml): the image installs exactly the
# lock (`uv sync --frozen`), and Dependabot's uv ecosystem watches both files.
#
# Direct dependencies are pinned exactly, as core's are; the lock pins the rest.
# Not a package — `app/` is copied into the image and run from /app.
[project]
name = "georiva-titiler-app"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.3",
    "uvicorn[standard]==0.54.0",
    "gunicorn==26.2.0",
    "titiler.core==2.4.0",
    # Both arrive with titiler.core; named here because the WMTS shim imports
    # them directly — the tile grid it reads an identify pixel off, and the
    # out-of-footprint error it answers that click with (#363).
    "morecantile==7.1.0",
    "rio-tiler==9.4.13",
    "redis==8.1.0",
    "httpx==0.28.1",
    # The store reader (ADR 0044 §9): opening an Upstream store, reading its
    # arrays, decoding its time coordinates, and the codec a virtual store's
    # GRIB chunks name. Pinned as core pins them; tests on each side keep the
    # two readers in agreement.
    "icechunk==2.3.1",
    "zarr==3.4.2",
    "xarray==2026.9.0",
    "gribberish[zarr]==1.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false
