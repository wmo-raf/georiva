# Dev overlay on docker-compose.yml (`just up` applies it).
#
# The root .env.sample carries prod-safe values; the dev ones live here. Each is
# `${VAR:-dev default}`, so whatever a developer sets in .env still wins and the
# default only fills a blank.
x-dev-env: &dev-env
  DEBUG: "True"
  GEORIVA_BASE_DOMAIN: ${GEORIVA_BASE_DOMAIN:-localhost}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}

services:
  georiva:
    build:
      target: dev
    command: django-dev-no-attach
    environment:
      <<: *dev-env
      MIGRATE_ON_STARTUP: "true"
      COLLECT_STATICFILES_ON_STARTUP: "true"
    volumes:
      - ./georiva:/georiva/app
    ports:
      - "8000:8000"

  georiva-celery-default-worker:
    build:
      target: dev
    command: celery-default-worker-dev
    environment:
      <<: *dev-env
      # A smaller pool than production's 4; set GEORIVA_CELERY_DEFAULT_WORKER_CONCURRENCY in .env to change it.
      GEORIVA_CELERY_WORKER_CONCURRENCY: ${GEORIVA_CELERY_DEFAULT_WORKER_CONCURRENCY:-2}
    volumes:
      - ./georiva:/georiva/app

  georiva-celery-ingestion-worker:
    build:
      target: dev
    command: celery-ingestion-worker-dev
    environment:
      <<: *dev-env
    volumes:
      - ./georiva:/georiva/app

  georiva-celery-processing-worker:
    build:
      target: dev
    command: celery-processing-worker-dev
    environment:
      <<: *dev-env
      # A smaller pool than production's 4; set GEORIVA_CELERY_PROCESSING_WORKER_CONCURRENCY in .env to change it.
      GEORIVA_CELERY_WORKER_CONCURRENCY: ${GEORIVA_CELERY_PROCESSING_WORKER_CONCURRENCY:-2}
    volumes:
      - ./georiva:/georiva/app

  georiva-celery-beat:
    build:
      target: dev
    environment:
      <<: *dev-env
    volumes:
      - ./georiva:/georiva/app

  georiva-minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console

  georiva-minio-consumer:
    build:
      target: dev
    environment:
      <<: *dev-env
    volumes:
      - ./georiva:/georiva/app

  georiva-staging-consumer:
    build:
      target: dev
    environment:
      <<: *dev-env
    volumes:
      - ./georiva:/georiva/app

  georiva-titiler-app:
    command: uvicorn-dev
    volumes:
      - ./titiler-app/app:/app/app
    ports:
      - "8888:8000"