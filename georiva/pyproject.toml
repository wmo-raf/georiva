[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "georiva"
authors = [{ name = "Erick Otenyo", email = "otenyo.erick@gmail.com" }]
description = """A modular geospatial backend for gridded data ingesting, processing, visualization, and analysis"""
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = []
dependencies = [
    "wagtail==7.4.4",
    "django-task-ferry==0.1.1",
    "dj-database-url==3.1.2",
    "django-timescaledb==0.2.13",
    "django-environ==0.14.0",
    "psycopg2==2.9.13",
    "django-dbbackup==5.4.0",
    "django-countries==9.1.0",
    "django-countries-geoextent>=0.0.1",
    "django-cleanup==9.0.0",
    "django-timezone-field==7.2.2",
    "django-redis==7.0.0",
    "celery-singleton==0.3.1",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "django-extensions==4.1",
    "channels",
    "minio==7.2.20",
    "gunicorn==26.2.0",
    "uvicorn[standard]==0.54.0",
    "wagtail-font-awesome-svg==2.0",
    "wagtail-icon-chooser>=0.3.0",
    "python-dateutil==2.9.0.post0",
    "wagtailgeowidget==9.1.0",
    "django-polymorphic==4.11.7",
    "django-vue-utils==0.1.8",
    "django-deep-translator==1.5.2",
    "drf-spectacular",
    "pydantic==2.14.3",
    "xarray==2026.9.0",
    "netcdf4==1.7.5.1.post1",
    "zarr>=3.2.1",
    "s3fs>=2024.6.0",
    "fsspec>=2024.6.0",
    "django-storages==1.14.6",
    "boto3==1.42.49",
    "dask[complete]",
    "django-cors-headers==4.9.0",
    "adm-boundary-manager==0.3.0",
    "rasterio==1.5.2",
    "pytz==2026.6",
    "cfgrib==0.9.15.1",
    "wagtail-color-panel==1.8.1",
    "rio-cogeo==7.0.4",
    "pint==0.26.2",
    "virtual-tiff==0.5.0",
    "virtualizarr==2.8.0",
    # Held below 2.50: eckitlib 2.5 bundles a second libproj that breaks pyproj (#625)
    "eccodeslib>=2.47.3.22,<2.50",
    "icechunk==2.3.1",
]

[project.scripts]
georiva = "georiva.manage:main"


[tool.setuptools]
include-package-data = true
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
platforms = ["Linux"]

[tool.setuptools.packages.find]
namespaces = true
where = ["src/"]
include = ["georiva", "georiva.*"]

[tool.setuptools.dynamic]
# version always from the code
version = { attr = "georiva.version.__version__" }

[tool.uv]
# eckitlib 2.5 bundles its own libproj, which clashes with pyproj's (#625).
# eccodeslib does not pin eckitlib, so the eccodeslib cap alone won't hold it.
constraint-dependencies = ["eckitlib<2.5"]
