  - {file: wave_swh, style: WAVE_SWH_SH_BLU_F0T20LST, slug: significant-wave-height-blues, name: "Significant wave height, 0 to 20 m, blues", quantity: ocean, scale_type: sqrt, unit: m}
  - {file: wave_swh, style: WAVE_SWH_SH_DOUGLAS_SEA_SCALE, slug: significant-wave-height-douglas, name: "Significant wave height, Douglas sea scale", quantity: ocean, scale_type: sqrt, unit: m}
