  - {file: rh1000, style: RH1000_SH_GRNBLU_F65T100I15, slug: relative-humidity-65-to-95-ramp, name: "Relative humidity, 65 to 95 %, continuous", quantity: humidity, scale_type: linear, unit: "%"}

